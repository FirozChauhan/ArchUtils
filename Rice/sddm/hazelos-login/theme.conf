# hazelos-login — tunables. Any key deleted/garbage falls back to the
# default hardcoded in Main.qml (noted after each =). Restart the greeter
# (or re-run --test-mode) to pick changes; no re-login needed.

[General]
# login user, no username UI — this is who you authenticate as (asrar)
user=asrar

# width of the invisible input column / layout stage in px      (660)
inputWidth=660

# password font: px size (28), family ("" = greeter default)    — dashes live here
fontPixelSize=28
fontFamily=

# palette:  ink / ghost / alarm                                 (#d8dee9 #3b4148 #bf616a)
accentColor=#d8dee9
dimColor=#3b4148
failColor=#bf616a

# logo: master switch (true), pixel-cell size in px (11 → 660×143 banner),
# vertical gap banner↔field in px (28). Size the whole logo with logoCell.
showLogo=true
logoCell=11
logoGap=36
